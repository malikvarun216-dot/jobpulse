name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check --select E,F --ignore E501,E402 .

      - name: Unit tests
        env:
          BRONZE_BUCKET: test-bronze-bucket
          AWS_REGION: ap-south-1
          ANTHROPIC_API_KEY: sk-test-dummy
        run: pytest tests/ spark/tests/ -v --tb=short

  # PySpark tests (Chat 25). The job above has no Spark, so these 17 tests were always skipped
  # and 9 of them had been failing unseen. Same Spark version as Glue 4.0 (3.3), on Java 11.
  spark-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PySpark
        run: pip install pyspark==3.3.2 pytest

      - name: PySpark tests
        run: pytest spark/tests/ -v --tb=short
