  seniority: mid          # 3 YOE (was "senior" — a stretch at 3 years)
  yoe: 3
  preferred_locations: [remote, india, delhi, new delhi, gurugram, gurgaon, noida, bangalore, mumbai]
  preferred_role_families: [DATA, SDE]
  salary_min_usd: 24000

# Weights must sum to 100
# skill_overlap raised to 50 — skills are the strongest signal for DE roles
# seniority_fit lowered to 10 — gap math is softened in scorer, not zeroed for senior roles
weights:
  skill_overlap:   50
  seniority_fit:   10
  location_fit:    15
  role_family_fit: 15
  salary_fit:       5
  freshness:        5
